name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Next.js build cache, keyed as described in node_modules/next/dist/docs/01-app/02-guides/ci-build-caching.md.
      # It runs before `npm ci` so the hash covers only the project's own sources.
      - name: Cache Next.js build output
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit policy
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No DATABASE_URL here on purpose: the tests use an in-memory fake and must not need a database.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The Prisma client refuses to load without a DATABASE_URL, so `next build` needs one.
          # Nothing connects to it during the build; this value is a placeholder, not a real database.
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/placeholder

  postgres-workflow:
    name: Synthetic PostgreSQL workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run demo:verify
